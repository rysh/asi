[project]
name = "sic26-slides"
version = "0.1.0"
description = "SiC26 presentation deck generator"
requires-python = ">=3.12"
dependencies = ["python-pptx>=1.0.2"]

[dependency-groups]
dev = ["pytest>=8.0", "pymupdf>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["slides*"]
